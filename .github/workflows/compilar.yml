name: Despliegue Automático a Firebase

on:
  push:
    branches: [ "supabase" ] # Se activa automáticamente al subir cambios a la rama main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Compilar el APK de depuración
        run: ./gradlew assembleDebug

      - name: Enviar APK a Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups testers
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_CREDENTIALS }}
