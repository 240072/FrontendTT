name: Compilar APK Automático

on:
  push:
    branches: [ "supabase" ] # Se ejecuta cada vez que subes algo a la rama main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Compilar el APK de prueba
        run: ./gradlew assembleDebug

      - name: Guardar el APK resultante
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      
